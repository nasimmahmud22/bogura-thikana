:root[data-theme="dark"]{--bg:#0f1713;--card:#17221c;--ink:#e5efe9;--mute:#9db1a6;--line:#2a3b32;--acc:#58c595;--acc-ink:#06241a;--hi:#183327;--red:#ee7b6e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;line-height:1.6}
main{max-width:600px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:1.55rem;margin:6px 0 2px}
.sub{margin:0 0 14px;color:var(--mute)}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
#q{font-size:1.1rem;border:2px solid var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:thin}
.chips button{flex:none;font:inherit;padding:6px 13px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 10px;color:var(--mute)}
button.b{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;background:var(--acc);color:var(--acc-ink);cursor:pointer}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.p h3{margin:0;font-size:1.05rem}
.meta{color:var(--mute);font-size:.92rem}
.dist{float:right;font-weight:600;color:var(--acc);margin-left:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
.tags span{font-size:.82rem;background:var(--hi);padding:1px 9px;border-radius:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.acts a,.acts button{font:inherit;font-size:.92rem;padding:6px 12px;border-radius:8px;border:1px solid var(--acc);color:var(--acc);text-decoration:none;background:transparent;cursor:pointer}
.acts .del{border-color:var(--red);color:var(--red)}
.empty{text-align:center;color:var(--mute);padding:26px 8px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:18px}
summary{font-weight:600;cursor:pointer}
label{display:block;font-weight:500;margin:10px 0 3px}
.note{font-size:.88rem;color:var(--mute);margin:8px 0 0}
#msg{color:var(--red);margin:6px 0 0}
</style>
</head>

<main>
<h1>বগুড়া ঠিকানা</h1>
<p class="sub">জিনিস, দোকান বা জায়গার নাম লিখুন। কোথায় পাবেন, কত দূরে, সব দেখুন।</p>
<input id="q" type="search" placeholder="যেমন: ঔষধ, মোবাইল, বাস, কলেজ, পিৎজা" aria-label="খুঁজুন">
<div class="chips" id="chips"></div>
<div class="bar"><span id="cnt"></span><button class="b alt" id="loc">আমার কাছেরগুলো আগে দেখান</button></div>
<div id="msg" role="alert"></div>
<div id="res"></div>

<details id="addbox">
<summary>নতুন দোকান বা জায়গার তথ্য পাঠান</summary>
<p class="note" style="margin-top:8px">আপনার পাঠানো তথ্য অ্যাডমিন যাচাই করবেন। যাচাইয়ের পরই সেটা সবার কাছে দেখা যাবে।</p>
<label for="an">নাম</label><input id="an" maxlength="60">
<label for="ac">ধরন</label><select id="ac"></select>
<label for="ap">কী কী পাওয়া যায় (কমা দিয়ে লিখুন)</label><input id="ap" placeholder="যেমন: চাল, ডাল, তেল">
<label for="aa">ঠিকানা</label><input id="aa" maxlength="120" placeholder="এলাকা, রাস্তা, কাছের চেনা জায়গা">
<label for="aph">ফোন (না থাকলে ফাঁকা রাখুন)</label><input id="aph" type="tel">
<label for="ag">অবস্থান (অক্ষাংশ, দ্রাঘিমাংশ)</label><input id="ag" placeholder="24.8465, 89.3773">
<div class="acts"><button id="gps" type="button">আমি এখন দোকানের কাছে আছি, অবস্থান বসান</button></div>
<p class="note">গুগল ম্যাপে জায়গা চেপে ধরলে যে সংখ্যা দেখায়, সেটাও বসানো যায়।</p>
<button class="b" id="save" style="margin-top:10px;width:100%">যাচাই করে তথ্য তৈরি করুন</button>
<p id="aerr" role="alert" style="color:var(--red);margin:6px 0 0"></p>
<div id="aout"></div>
</details>
</main>

["জেলা প্রশাসকের কার্যালয় (ডিসি অফিস)","Deputy Commissioner's Office","gov",24.8469,89.3776,"শহীদ খোকন লেন, করতোয়া নদীর পাশে","051-69110","সরকারি অফিস বিআরটিএ ড্রাইভিং লাইসেন্স ডিসি"]
];
var SYN={"ওষুধ":"ঔষধ","medicine":"ঔষধ","মেডিসিন":"ঔষধ","ফোন":"মোবাইল","phone":"মোবাইল","mobile":"মোবাইল","bus":"বাস","train":"ট্রেন","hospital":"হাসপাতাল","doctor":"ডাক্তার","school":"স্কুল","college":"কলেজ","pharmacy":"ফার্মেসি","food":"খাবার","restaurant":"রেস্টুরেন্ট","pizza":"পিৎজা","laptop":"ল্যাপটপ","computer":"কম্পিউটার","clothes":"কাপড়","market":"মার্কেট","মেডিকেল":"ফার্মেসি"};
var KEY="bogura-thikana-v1",U=[];

function save(){try{localStorage.setItem(KEY,JSON.stringify(U))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var bn=function(n,d){return Number(n).toLocaleString("bn-BD",{maximumFractionDigits:d||0})};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var cat="all",me=null;

function all(){
var a=D.map(function(x,i){return {n:x[0],e:x[1],c:x[2],la:x[3],lo:x[4],ad:x[5],ph:x[6],kw:x[7],u:false}});
U.forEach(function(x,i){a.push({n:x.n,e:"",c:x.c,la:x.la,lo:x.lo,ad:x.ad,ph:x.ph,kw:x.kw,u:true,i:i})});
return a;
}
function km(a,b,c,d){var R=6371,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function dtxt(k){return k<1?bn(Math.round(k*10)*100)+" মি.":bn(k,1)+" কিমি"}

function chips(){
var h='<button data-c="all" aria-pressed="'+(cat==="all")+'">সব</button>';
Object.keys(CAT).forEach(function(k){h+='<button data-c="'+k+'" aria-pressed="'+(cat===k)+'">'+CAT[k]+'</button>'});
$("chips").innerHTML=h;
$("chips").querySelectorAll("button").forEach(function(b){b.onclick=function(){cat=b.dataset.c;chips();render()}});
}
function render(){
var q=$("q").value.trim().toLowerCase(),toks=q?q.split(/\s+/):[];
var L=all().filter(function(p){
if(cat!=="all"&&p.c!==cat)return false;
var hay=(p.n+" "+p.e+" "+CAT[p.c]+" "+p.kw+" "+p.ad).toLowerCase();
return toks.every(function(t){return hay.indexOf(t)>=0||(SYN[t]&&hay.indexOf(SYN[t])>=0)});
});
L.forEach(function(p){p.d=me?km(me.la,me.lo,p.la,p.lo):null});
if(me)L.sort(function(a,b){return a.d-b.d});
$("cnt").textContent=bn(L.length)+"টি ফলাফল"+(me?" · কাছেরগুলো আগে":"");
if(!L.length){$("res").innerHTML='<div class="empty">কিছু পাওয়া যায়নি। অন্য শব্দে খুঁজুন, বা নিচের ফর্মে এই দোকান বা জায়গা নিজে যোগ করুন।</div>';return}
$("res").innerHTML=L.map(function(p){
var tags=p.kw?p.kw.split(/[\s,]+/).slice(0,6).filter(Boolean).map(function(t){return "<span>"+esc(t)+"</span>"}).join(""):"";
var ll=p.la+","+p.lo;
return '<div class="p">'+(p.d!=null?'<span class="dist">'+dtxt(p.d)+'</span>':"")+'<h3>'+esc(p.n)+'</h3><div class="meta">'+CAT[p.c]+(p.u?" · আপনার যোগ করা":"")+'</div>'+(p.ad?'<div class="meta">'+esc(p.ad)+'</div>':"")+(tags?'<div class="tags">'+tags+'</div>':"")+
'<div class="acts"><a href="https://www.google.com/maps/search/?api=1&query='+ll+'" target="_blank" rel="noopener">ম্যাপে দেখুন</a><a href="https://www.google.com/maps/dir/?api=1&destination='+ll+'" target="_blank" rel="noopener">রাস্তা দেখুন</a>'+(p.ph?'<a href="tel:'+esc(p.ph.replace(/[^+\d]/g,""))+'">'+esc(p.ph)+'</a>':"")+(p.u?'<button class="del" data-i="'+p.i+'">মুছুন</button>':"")+'</div></div>';
}).join("");
$("res").querySelectorAll(".del").forEach(function(b){b.onclick=function(){U.splice(+b.dataset.i,1);save();render()}});
}
$("q").oninput=render;
function getPos(ok,fail){
if(!navigator.geolocation){fail();return}
navigator.geolocation.getCurrentPosition(function(p){ok(p.coords.latitude,p.coords.longitude)},fail,{timeout:10000});
}
$("loc").onclick=function(){
$("msg").textContent="";
getPos(function(a,b){me={la:a,lo:b};$("loc").textContent="আপনার অবস্থান ধরা হয়েছে";render()},
function(){$("msg").textContent="আপনার অবস্থান পাওয়া যায়নি। ফোনের লোকেশন চালু আছে কি না এবং ব্রাউজারকে অনুমতি দিয়েছেন কি না দেখুন।"});
};
$("ac").innerHTML=Object.keys(CAT).map(function(k){return '<option value="'+k+'">'+CAT[k]+"</option>"}).join("");
/* অ্যাডমিনের হোয়াটসঅ্যাপ নম্বর এখানে বসান, যেমন "8801712345678" */
var ADMIN_WA="";
var BOX={a:24.5,b:25.2,c:88.9,d:89.7};
var BAD=["casino","betting","porn","sex","xxx","loan","ক্যাসিনো","বেটিং","জুয়া","পর্ন"];
function dig(s){return s.replace(/[০-৯]/g,function(c){return "০১২৩৪৫৬৭৮৯".indexOf(c)})}
function norm(s){return s.toLowerCase().replace(/\s+/g," ").trim()}
function tday(){return new Date().toISOString().slice(0,10)}
function sentN(){try{var o=JSON.parse(localStorage.getItem("bt-sent")||"{}");return o.d===tday()?o.n:0}catch(e){return 0}}
function markSent(){try{localStorage.setItem("bt-sent",JSON.stringify({d:tday(),n:sentN()+1}))}catch(e){}}
$("gps").onclick=function(){
$("aerr").textContent="";
getPos(function(a,b){$("ag").value=a.toFixed(5)+", "+b.toFixed(5)},function(){$("aerr").textContent="অবস্থান পাওয়া যায়নি। লোকেশনের অনুমতি দিন, অথবা সংখ্যা হাতে লিখুন।"});
};
function fail(m,id){$("aerr").textContent=m;if(id)$(id).focus();return null}
$("save").onclick=function(){
$("aerr").textContent="";$("aout").innerHTML="";
var n=$("an").value.trim().replace(/\s+/g," "),ad=$("aa").value.trim(),ph=dig($("aph").value).replace(/[\s-]/g,""),ps=$("ap").value.split(/[,،]+/).map(function(x){return x.trim()}).filter(Boolean);
var g=dig($("ag").value).split(/[,\s]+/).filter(Boolean).map(parseFloat);
if(sentN()>=5)return fail("আজকের জন্য সর্বোচ্চ ৫টি তথ্য পাঠানো যায়। কাল আবার চেষ্টা করুন।");
if(n.length<3||!/[\u0980-\u09FFa-zA-Z]/.test(n))return fail("দোকান বা জায়গার সঠিক নাম লিখুন (কমপক্ষে ৩ অক্ষর)।","an");
if(ad.length<4)return fail("ঠিকানা লিখুন, যাতে অন্যরা জায়গাটা খুঁজে পায়।","aa");
var all=norm(n+" "+ad+" "+ps.join(" "));
if(/https?:|www\.|\.com|\.net|@/.test(all))return fail("নাম, ঠিকানা বা জিনিসের তালিকায় লিংক বা ইমেইল দেওয়া যাবে না।","an");
for(var i=0;i<BAD.length;i++)if(all.indexOf(BAD[i])>=0)return fail("এই লেখাটি গ্রহণ করা যাবে না। শুধু দোকান বা জায়গার সত্যিকারের তথ্য দিন।","an");
if(ps.length>15||ps.some(function(x){return x.length>30}))return fail("জিনিসের তালিকায় সর্বোচ্চ ১৫টি জিনিস দিন, প্রতিটি ৩০ অক্ষরের মধ্যে।","ap");
if(ph&&!/^(\+?88)?01[3-9]\d{8}$/.test(ph)&&!/^0\d{7,10}$/.test(ph))return fail("ফোন নম্বর ঠিক নেই। মোবাইল হলে ০১৭১২৩৪৫৬৭৮ এর মতো লিখুন।","aph");
if(g.length<2||isNaN(g[0])||isNaN(g[1]))return fail("অবস্থান দিন, যেমন: 24.8465, 89.3773","ag");
if(g[0]<BOX.a||g[0]>BOX.b||g[1]<BOX.c||g[1]>BOX.d)return fail("এই অবস্থান বগুড়া জেলার বাইরে মনে হচ্ছে। সংখ্যা আবার দেখুন।","ag");
for(var j=0;j<D.length;j++)if(norm(D[j][0])===norm(n)||norm(D[j][1])===norm(n))return fail("“"+D[j][0]+"” আগে থেকেই তালিকায় আছে।","an");
markSent();
var t="নতুন জায়গার প্রস্তাব (বগুড়া ঠিকানা)\nনাম: "+n+"\nধরন: "+CAT[$("ac").value]+"\nকী পাওয়া যায়: "+(ps.join(", ")||"—")+"\nঠিকানা: "+ad+"\nফোন: "+(ph||"—")+"\nঅবস্থান: "+g[0]+", "+g[1]+"\nম্যাপ: https://www.google.com/maps/search/?api=1&query="+g[0]+","+g[1];
var h='<div class="p" style="margin-top:12px"><b>তথ্য ঠিক আছে। এবার অ্যাডমিনকে পাঠান:</b><pre id="atxt" style="white-space:pre-wrap;font:inherit;background:var(--hi);padding:10px;border-radius:8px;margin:8px 0">'+esc(t)+'</pre><div class="acts">';
if(ADMIN_WA)h+='<a href="https://wa.me/'+ADMIN_WA+'?text='+encodeURIComponent(t)+'" target="_blank" rel="noopener">হোয়াটসঅ্যাপে পাঠান</a>';
h+='<button id="cp" type="button">কপি করুন</button></div><p class="note">অ্যাডমিন যাচাই করে অ্যাপে যোগ করলে সবাই দেখতে পাবে।</p></div>';
$("aout").innerHTML=h;
$("cp").onclick=function(){try{navigator.clipboard.writeText(t).then(function(){$("cp").textContent="কপি হয়েছে"},function(){$("cp").textContent="কপি হয়নি, লেখাটা চেপে ধরে কপি করুন"})}catch(e){$("cp").textContent="কপি হয়নি, লেখাটা চেপে ধরে কপি করুন"}};
};
chips();render();
</script>
